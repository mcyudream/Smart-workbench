name: Build & Release

on:
  push:
    branches: [ main, 1.12.2 ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建（JDK 8 + ForgeGradle 2.3）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 8（1.12.2 Forge 构建必须）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 安装 Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: 构建
        run: gradle clean build --no-daemon

      - name: 收集产物（排除 sources）
        run: |
          mkdir -p release
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
          ls -l release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: smart_workbench-jars
          path: release/*.jar
          if-no-files-found: error

  release:
    name: 发布正式版（推 v* 标签触发）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 安装 Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: 用标签版本号构建（v1.2.3 -> 1.2.3）
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = '$VER'/" build.gradle
          echo "release version: $VER"
          gradle clean build --no-daemon

      - name: 收集产物
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} "release/smart_workbench-1.12.2-$VER.jar" \;
          ls -l release

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
